<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>Orders</h1>
    <div id="admin-guard"></div>

    <div id="admin-content" style="display:none;">
      <label for="status-filter">Show</label>
      <select id="status-filter" style="max-width:220px;">
        <option value="all">All</option>
        <option value="placed">Placed</option>
        <option value="prepared" selected>Prepared</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>

      <div class="scroll-list" id="orders-list"></div>
    </div>
  </main>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession, isAdmin } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";

    renderNav();

    const STATUSES = ["placed", "cancelled", "prepared", "delivered"];

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      const guard = document.getElementById("admin-guard");

      if (!session) {
        guard.innerHTML = `<p class="error">You need to <a href="${loginUrlWithReturnTo()}">log in</a> as an admin to view this page.</p>`;
      } else if (!isAdmin(session)) {
        guard.innerHTML = `<p class="error">Your account doesn't have admin access.</p>`;
      } else {
        document.getElementById("admin-content").style.display = "block";
        initOrders(config, session.idToken);
      }
    });

    function initOrders(config, token) {
      const filterSelect = document.getElementById("status-filter");

      async function refresh() {
        const list = document.getElementById("orders-list");
        const filter = filterSelect.value;
        const { orders } = await apiRequest(config.apiUrl, `/admin/orders?status=${encodeURIComponent(filter)}`, { token });

        if (orders.length === 0) {
          list.innerHTML = `<p class="muted">${
            filter === "all" ? "No orders yet." : `No orders in ${filter} status right now.`
          }</p>`;
          return;
        }

        list.innerHTML = orders
          .map((order) => {
            const createdAt = new Date(order.createdAt).toLocaleString();
            return `
          <div class="card order-card" data-order-id="${order.orderId}" data-customer-sub="${order.customerSub}">
            <p>
              <strong>${createdAt}</strong>
              &nbsp;<select class="status-select" name="status-${order.orderId}" aria-label="Status for order placed ${createdAt}">
                ${STATUSES.map((s) => `<option value="${s}" ${s === order.status ? "selected" : ""}>${s}</option>`).join("")}
              </select>
            </p>
            <p class="muted">${order.deliveryName} - ${order.deliveryAddress}</p>
            <p class="muted">${order.deliveryEmail}${order.deliveryPhone ? ` - ${order.deliveryPhone}` : ""}</p>
            ${order.readyDate ? `<p class="muted">Ready for pickup: ${order.readyDate}</p>` : ""}
            <p>Total: <strong>${formatPrice(order.totalCents)}</strong></p>
            <ul>
              ${order.items
                .map((i) => {
                  const addOnLabels = (i.selectedAddOns || []).map((a) => a.description);
                  const addOnText = addOnLabels.length ? ` <span class="muted">(${addOnLabels.join(", ")})</span>` : "";
                  return `<li>${i.quantity} x ${i.name}${addOnText} - ${formatPrice(i.unitPriceCents * i.quantity)}</li>`;
                })
                .join("")}
            </ul>
          </div>`;
          })
          .join("");

        list.querySelectorAll(".status-select").forEach((select) => {
          select.addEventListener("change", async (e) => {
            const card = e.target.closest(".order-card");
            const { orderId, customerSub } = card.dataset;
            await apiRequest(config.apiUrl, `/admin/orders/${customerSub}/${orderId}`, {
              method: "PUT",
              token,
              body: { status: select.value },
            });
            refresh();
          });
        });
      }

      filterSelect.addEventListener("change", refresh);
      refresh();
    }
  </script>
</body>
</html>
