<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Orders - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>My orders</h1>
    <div id="orders">
      <p class="muted">Loading...</p>
    </div>
    <div id="pagination" class="pagination"></div>
  </main>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { confirmAction, escapeHtml } from "/js/admin.js";
    import { showToast } from "/js/toast.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";
    import { formatMacros } from "/js/pricing.js";

    renderNav();

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      if (!session) {
        window.location.href = loginUrlWithReturnTo();
        return;
      }

      const PAGE_SIZE = 5;
      const container = document.getElementById("orders");
      const paginationEl = document.getElementById("pagination");
      let allOrders = [];
      let currentPage = 1;

      // The API says whether an order can still be changed (until the Friday
      // before its ready date); customers are told the deadline is 2:00 PM.
      function orderActions(order) {
        if (order.changeable) {
          return `
            <div class="order-actions">
              <button type="button" class="secondary edit-order">Edit</button>
              <button type="button" class="secondary cancel-order">Cancel order</button>
            </div>
            <p class="muted order-deadline-note">You can edit or cancel this order until Friday at 2:00 PM.</p>
            <div class="allergen-note">
              <strong>Please Note</strong>
              <p>Meals are prepared in a kitchen that handles common allergens and cannot be guaranteed allergen-free. All nutritional information is estimated and may vary.</p>
            </div>`;
        }
        if (order.status === "placed") {
          return `
            <p class="order-locked">
              <strong>Need to make changes to your order?</strong> Please email us no later than
              Friday at 2:00 PM. Changes and cancellations cannot be made after this deadline.
            </p>`;
        }
        return "";
      }

      async function cancelOnServer(orderId) {
        await apiRequest(config.apiUrl, `/orders/${orderId}`, {
          method: "PUT",
          token: session.idToken,
          body: { status: "cancelled" },
        });
      }

      // A refused change (e.g. the deadline passed while the page was open):
      // say why and re-render from the server so the buttons go away.
      async function showChangeError(err) {
        showToast(err.message, { error: true });
        await loadOrders();
      }

      function renderPage() {
        if (allOrders.length === 0) {
          container.innerHTML = `<p class="muted">No orders yet. <a href="/index.html">Browse the menu</a>.</p>`;
          paginationEl.innerHTML = "";
          return;
        }

        const totalPages = Math.ceil(allOrders.length / PAGE_SIZE);
        currentPage = Math.min(Math.max(currentPage, 1), totalPages);
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageOrders = allOrders.slice(start, start + PAGE_SIZE);

        container.innerHTML = pageOrders
          .map(
            (order) => `
          <div class="card order-card" data-order-id="${order.orderId}">
            <p><strong>${new Date(order.createdAt).toLocaleString()}</strong>
              &nbsp;<span class="status">${order.status}</span></p>
            ${order.readyDate ? `<p class="muted">Ready for pickup: ${order.readyDate}</p>` : ""}
            <ul>
              ${order.items
                .map((i) => {
                  const addOnParts = (i.selectedAddOns || []).map((a) => {
                    const macrosText = formatMacros(a.macros);
                    return `${escapeHtml(a.name)}${macrosText ? ` [${macrosText}]` : ""}`;
                  });
                  const addOnText = addOnParts.length ? ` <span class="muted">(${addOnParts.join(", ")})</span>` : "";
                  const noteText = i.note ? ` <span class="muted">- Note: ${i.note}</span>` : "";
                  return `<li>${i.quantity} x ${i.name}${addOnText} - ${formatPrice(i.unitPriceCents * i.quantity)}${noteText}</li>`;
                })
                .join("")}
              ${(order.extras || [])
                .map((e) => {
                  const macrosText = formatMacros(e.macros);
                  const details = [e.description && escapeHtml(e.description), macrosText && `${macrosText} each`].filter(Boolean);
                  return `<li class="order-extra">${e.quantity} x ${escapeHtml(e.name)} - ${formatPrice(e.priceCents * e.quantity)}${
                    details.length ? ` <span class="muted">(${details.join(" - ")})</span>` : ""
                  }</li>`;
                })
                .join("")}
            </ul>
            <p>Total: <strong>${formatPrice(order.totalCents)}</strong></p>
            <p class="muted">${escapeHtml(order.customerName)}${order.contactPhone ? ` - ${escapeHtml(order.contactPhone)}` : ""}</p>
            <p class="muted">Pickup: ${order.pickupName ? escapeHtml(order.pickupName) : "you"}</p>
            ${orderActions(order)}
          </div>`
          )
          .join("");

        container.querySelectorAll(".edit-order").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const orderId = e.target.closest(".order-card").dataset.orderId;
            const order = allOrders.find((o) => o.orderId === orderId);
            try {
              await cancelOnServer(orderId);
            } catch (err) {
              await showChangeError(err);
              return;
            }
            sessionStorage.setItem(
              "editOrderCart",
              JSON.stringify({
                items: order.items.map((i) => ({
                  mealId: i.mealId,
                  quantity: i.quantity,
                  selectedAddOnIds: (i.selectedAddOns || []).map((a) => a.addOnId),
                  note: i.note || "",
                })),
                extras: (order.extras || []).map((e) => ({ extraId: e.extraId, quantity: e.quantity })),
                delivery: {
                  phone: order.contactPhone,
                  pickupName: order.pickupName,
                },
              })
            );
            window.location.href = "/index.html";
          });
        });

        container.querySelectorAll(".cancel-order").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const orderId = e.target.closest(".order-card").dataset.orderId;
            const ok = await confirmAction("Cancel this order? This can't be undone.", { confirmLabel: "Cancel order" });
            if (!ok) return;
            try {
              await cancelOnServer(orderId);
            } catch (err) {
              await showChangeError(err);
              return;
            }
            const order = allOrders.find((o) => o.orderId === orderId);
            Object.assign(order, { status: "cancelled", changeable: false });
            renderPage();
            showToast("Your order was cancelled");
          });
        });

        if (totalPages <= 1) {
          paginationEl.innerHTML = "";
          return;
        }
        paginationEl.innerHTML = `
          <button type="button" class="secondary" id="prev-page" ${currentPage === 1 ? "disabled" : ""}>Previous</button>
          <span class="muted">Page ${currentPage} of ${totalPages}</span>
          <button type="button" class="secondary" id="next-page" ${currentPage === totalPages ? "disabled" : ""}>Next</button>
        `;
        document.getElementById("prev-page").addEventListener("click", () => {
          currentPage -= 1;
          renderPage();
        });
        document.getElementById("next-page").addEventListener("click", () => {
          currentPage += 1;
          renderPage();
        });
      }

      async function loadOrders() {
        try {
          const { orders } = await apiRequest(config.apiUrl, "/orders", { token: session.idToken });
          allOrders = orders;
          renderPage();
        } catch (err) {
          container.innerHTML = `<p class="error">Couldn't load your orders: ${escapeHtml(err.message)}</p>`;
        }
      }

      await loadOrders();
    });
  </script>
</body>
</html>
