<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="nav"></header>

  <main>
    <div class="tabs">
      <button id="tab-login" class="active">Log in</button>
      <button id="tab-signup">Sign up</button>
    </div>

    <section id="login-panel" class="card form-narrow">
      <h2>Log in</h2>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" />
      <label for="login-password">Password</label>
      <input id="login-password" type="password" />
      <p class="error" id="login-error" style="display:none;"></p>
      <button id="login-button">Log in</button>
      <p><a href="#" id="forgot-password-link">Forgot password?</a></p>
    </section>

    <section id="reset-panel" class="card form-narrow" style="display:none;">
      <h2>Reset password</h2>
      <div id="reset-request-form">
        <label for="reset-email">Email</label>
        <input id="reset-email" type="email" />
        <p class="error" id="reset-request-error" style="display:none;"></p>
        <button id="reset-request-button">Send reset code</button>
      </div>

      <div id="reset-confirm-form" style="display:none;">
        <p class="muted">We emailed a reset code to your address.</p>
        <label for="reset-code">Reset code</label>
        <input id="reset-code" type="text" />
        <label for="reset-new-password">New password</label>
        <input id="reset-new-password" type="password" placeholder="At least 8 characters" />
        <p class="error" id="reset-confirm-error" style="display:none;"></p>
        <button id="reset-confirm-button">Set new password</button>
        <button class="secondary" id="reset-resend-button">Resend code</button>
      </div>
    </section>

    <section id="signup-panel" class="card form-narrow" style="display:none;">
      <h2>Sign up</h2>
      <div id="signup-form">
        <label for="signup-name">Name</label>
        <input id="signup-name" type="text" />
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" />
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" placeholder="At least 8 characters" />
        <p class="error" id="signup-error" style="display:none;"></p>
        <button id="signup-button">Sign up</button>
      </div>

      <div id="confirm-form" style="display:none;">
        <p class="muted">We emailed a confirmation code to your address.</p>
        <label for="confirm-code">Confirmation code</label>
        <input id="confirm-code" type="text" />
        <p class="error" id="confirm-error" style="display:none;"></p>
        <button id="confirm-button">Confirm</button>
        <button class="secondary" id="resend-button">Resend code</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import {
      signUp, confirmSignUp, resendConfirmationCode, signIn,
      forgotPassword, confirmForgotPassword,
    } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { getSafeRedirectTarget } from "/js/redirect.js";

    renderNav();

    function showTab(tab) {
      document.getElementById("login-panel").style.display = tab === "login" ? "block" : "none";
      document.getElementById("signup-panel").style.display = tab === "signup" ? "block" : "none";
      document.getElementById("reset-panel").style.display = tab === "reset" ? "block" : "none";
      document.getElementById("tab-login").classList.toggle("active", tab === "login");
      document.getElementById("tab-signup").classList.toggle("active", tab === "signup");
    }
    document.getElementById("tab-login").addEventListener("click", () => showTab("login"));
    document.getElementById("tab-signup").addEventListener("click", () => showTab("signup"));
    document.getElementById("forgot-password-link").addEventListener("click", (e) => {
      e.preventDefault();
      showTab("reset");
    });

    function showError(id, message) {
      const el = document.getElementById(id);
      el.textContent = message;
      el.style.display = "block";
    }
    function hideError(id) {
      document.getElementById(id).style.display = "none";
    }

    let pendingEmail = null;

    loadConfig().then((config) => {
      document.getElementById("login-button").addEventListener("click", async () => {
        hideError("login-error");
        try {
          await signIn({
            region: config.region,
            clientId: config.userPoolClientId,
            email: document.getElementById("login-email").value,
            password: document.getElementById("login-password").value,
          });
          window.location.href = getSafeRedirectTarget();
        } catch (err) {
          showError("login-error", err.message);
        }
      });

      document.getElementById("signup-button").addEventListener("click", async () => {
        hideError("signup-error");
        const email = document.getElementById("signup-email").value;
        try {
          await signUp({
            region: config.region,
            clientId: config.userPoolClientId,
            email,
            password: document.getElementById("signup-password").value,
            name: document.getElementById("signup-name").value,
          });
          pendingEmail = email;
          document.getElementById("signup-form").style.display = "none";
          document.getElementById("confirm-form").style.display = "block";
        } catch (err) {
          showError("signup-error", err.message);
        }
      });

      document.getElementById("confirm-button").addEventListener("click", async () => {
        hideError("confirm-error");
        try {
          await confirmSignUp({
            region: config.region,
            clientId: config.userPoolClientId,
            email: pendingEmail,
            code: document.getElementById("confirm-code").value,
          });
          showTab("login");
          document.getElementById("login-email").value = pendingEmail;
        } catch (err) {
          showError("confirm-error", err.message);
        }
      });

      document.getElementById("resend-button").addEventListener("click", async () => {
        hideError("confirm-error");
        try {
          await resendConfirmationCode({
            region: config.region,
            clientId: config.userPoolClientId,
            email: pendingEmail,
          });
        } catch (err) {
          showError("confirm-error", err.message);
        }
      });

      let pendingResetEmail = null;

      document.getElementById("reset-request-button").addEventListener("click", async () => {
        hideError("reset-request-error");
        const email = document.getElementById("reset-email").value;
        try {
          await forgotPassword({ region: config.region, clientId: config.userPoolClientId, email });
          pendingResetEmail = email;
          document.getElementById("reset-request-form").style.display = "none";
          document.getElementById("reset-confirm-form").style.display = "block";
        } catch (err) {
          showError("reset-request-error", err.message);
        }
      });

      document.getElementById("reset-confirm-button").addEventListener("click", async () => {
        hideError("reset-confirm-error");
        try {
          await confirmForgotPassword({
            region: config.region,
            clientId: config.userPoolClientId,
            email: pendingResetEmail,
            code: document.getElementById("reset-code").value,
            newPassword: document.getElementById("reset-new-password").value,
          });
          showTab("login");
          document.getElementById("login-email").value = pendingResetEmail;
          document.getElementById("login-password").value = "";
          // Reset the form back to its initial state in case the user comes back later.
          document.getElementById("reset-request-form").style.display = "block";
          document.getElementById("reset-confirm-form").style.display = "none";
          document.getElementById("reset-email").value = "";
          document.getElementById("reset-code").value = "";
          document.getElementById("reset-new-password").value = "";
        } catch (err) {
          showError("reset-confirm-error", err.message);
        }
      });

      document.getElementById("reset-resend-button").addEventListener("click", async () => {
        hideError("reset-confirm-error");
        try {
          await forgotPassword({ region: config.region, clientId: config.userPoolClientId, email: pendingResetEmail });
        } catch (err) {
          showError("reset-confirm-error", err.message);
        }
      });
    });
  </script>
</body>
</html>
