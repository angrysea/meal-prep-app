<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTX Meals Menu</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Cinzel:wght@600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111111; margin: 0; padding: 0; background: #ffffff; }
    .flyer { display: flex; align-items: flex-start; gap: 2rem; max-width: 800px; margin: 2rem auto; padding: 0 1.5rem 3rem; }
    .flyer-sidebar { flex-shrink: 0; width: 130px; display: flex; flex-direction: column; align-items: center; }
    .flyer-month-wrap { width: 130px; display: flex; align-items: center; justify-content: center; }
    .flyer-month { font-family: "Permanent Marker", cursive; color: #d20d0d; white-space: nowrap; transform: rotate(-90deg); }
    .flyer-qr { width: 110px; height: 110px; margin-top: 1rem; }
    .flyer-scan-caption { font-family: "Anton", sans-serif; font-size: 0.75rem; color: #111111; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.5rem; text-align: center; }
    .flyer-content { flex: 1; min-width: 0; position: relative; }
    .flyer-watermark { position: absolute; top: 50%; left: 0; width: 100%; opacity: 0.07; z-index: -1; pointer-events: none; transform: translateY(-50%) scaleY(1.2); }
    h2 { font-family: "Cinzel", Georgia, serif; font-weight: 700; color: #8f1a1a; text-transform: uppercase; letter-spacing: 0.01em; font-size: 1.85rem; margin: 2rem 0 0.1rem; }
    h3 { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 400; color: #8f1a1a; font-size: 1.3rem; margin: 1.25rem 0 0.25rem; }
    h2 + h3 { margin-top: 0; }
    .subheading { font-family: "Playfair Display", Georgia, serif; font-style: italic; color: #8f1a1a; font-size: 1.3rem; margin: 0 0 0.6rem; }
    .item { margin-bottom: 0.9rem; }
    .item-name { font-weight: bold; margin-bottom: 0.15rem; }
    .item-desc { color: #666666; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .item-macros { font-weight: bold; font-size: 0.85rem; }
    .muted { color: #666666; }
    .flyer-footer { margin-top: 2.5rem; text-align: center; color: #aa0e0c; }
    .flyer-footer .footer-line1 { font-weight: bold; text-transform: uppercase; letter-spacing: 0.02em; }
    .flyer-footer .footer-line2 { font-size: 0.85rem; margin-top: 0.2rem; }
    .flyer-actions { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1.5rem; }
    .flyer-actions button { background: #d20d0d; color: #fff; border: none; border-radius: 6px; padding: 0.6rem 1.1rem; font-size: 0.95rem; cursor: pointer; font-family: inherit; }
    .flyer-actions button.secondary { background: transparent; color: #d20d0d; border: 1px solid #d20d0d; }
    .text-status { text-align: center; margin-top: 0.75rem; font-size: 0.9rem; }
    .text-status.error { color: #aa0e0c; }
    dialog { border: none; border-radius: 10px; padding: 1.5rem; width: 90%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    dialog::backdrop { background: rgba(0,0,0,0.5); }
    dialog h2 { margin-top: 0; font-size: 1.3rem; }
    dialog textarea { width: 100%; min-height: 100px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; padding: 0.5rem; }
    dialog .dialog-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    dialog .dialog-actions button { background: #d20d0d; color: #fff; border: none; border-radius: 6px; padding: 0.6rem 1.1rem; font-size: 0.95rem; cursor: pointer; }
    dialog .dialog-actions button.secondary { background: transparent; color: #d20d0d; border: 1px solid #d20d0d; }
    @media print {
      .flyer-actions, .text-status { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="flyer">
    <div class="flyer-sidebar">
      <div class="flyer-month-wrap"><div class="flyer-month" id="flyer-sidebar-text"></div></div>
      <img class="flyer-qr" src="" alt="QR code to order" id="flyer-qr" />
      <div class="flyer-scan-caption">Scan to order</div>
    </div>
    <div class="flyer-content">
      <img class="flyer-watermark" src="/assets/watermark.jpg" alt="" />
      <div id="menu-body"><p class="muted">Loading menu...</p></div>
      <div class="flyer-footer">
        <div class="footer-line1">Order by Friday 2 PM &bull; Prepared Sunday &bull; Monday pickup</div>
        <div class="footer-line2">Monthly menu is planned in advance and subject to change</div>
      </div>
      <div class="flyer-actions">
        <button type="button" id="print-button" onclick="window.print()">View as PDF</button>
        <button type="button" class="secondary" id="text-button" style="display:none;">Send this menu to customers</button>
        <button type="button" class="secondary" id="cancel-button">Cancel</button>
      </div>
      <p class="text-status" id="text-status" style="display:none;"></p>
    </div>
  </div>

  <dialog id="text-preview-dialog">
    <h2>Preview message</h2>
    <p class="muted" id="text-preview-recipients"></p>
    <p class="muted">Sent by email or text, based on each customer's preference.</p>
    <textarea id="text-preview-message" readonly></textarea>
    <div class="dialog-actions">
      <button type="button" id="text-send-button">Send</button>
      <button type="button" class="secondary" id="text-cancel-button">Cancel</button>
    </div>
  </dialog>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession, isAdmin } from "/js/cognito.js";
    import { formatMacros } from "/js/pricing.js";
    import { MONTH_NAMES, formatDateHeading, groupMealsForMonth } from "/js/monthlyMenu.js";

    const params = new URLSearchParams(location.search);
    const period = params.get("period") === "weekly" ? "weekly" : "monthly";

    function itemHtml(meal) {
      const macrosText = formatMacros(meal.macros);
      return `
        <div class="item">
          <div class="item-name">${meal.name} - ${formatPrice(meal.priceCents)}</div>
          <div class="item-desc">${meal.description || ""}</div>
          ${macrosText ? `<div class="item-macros">${macrosText}</div>` : ""}
        </div>`;
    }

    function sectionsHtml(meals, monthFilterValue, noMenuMessage) {
      const { staples, byDate, sortedDates } = groupMealsForMonth(meals, monthFilterValue);
      const [, month] = monthFilterValue.split("-").map(Number);
      const monthName = MONTH_NAMES[month - 1] || MONTH_NAMES[new Date().getMonth()];

      const staplesHtml = staples.length
        ? `
        <h2>Staple meals</h2>
        <p class="subheading">Available Weekly for the month of ${monthName}</p>
        ${staples.map(itemHtml).join("")}`
        : "";

      const rotatingHtml = sortedDates.length
        ? `
        <h2>Rotating meals</h2>
        ${sortedDates
          .map(
            (isoDate) => `
          <h3>${formatDateHeading(isoDate)}</h3>
          ${byDate.get(isoDate).map(itemHtml).join("")}`
          )
          .join("")}`
        : "";

      return staples.length === 0 && sortedDates.length === 0
        ? `<p class="muted">${noMenuMessage}</p>`
        : `${staplesHtml}${rotatingHtml}`;
    }

    async function render(config) {
      const [{ meals }, { nextReadyDate }] = await Promise.all([
        apiRequest(config.apiUrl, "/meals"),
        apiRequest(config.apiUrl, "/settings"),
      ]);

      const now = new Date();
      const sidebarEl = document.getElementById("flyer-sidebar-text");
      const wrapEl = document.querySelector(".flyer-month-wrap");

      let body;
      if (period === "weekly") {
        document.title = "GTX Meals - This Week's Menu";
        sidebarEl.textContent = "THIS WEEKS MENU";
        sidebarEl.style.fontSize = "3.4rem";
        wrapEl.style.height = "600px";
        const monthFilterValue = nextReadyDate || "no-ready-date-set";
        body = sectionsHtml(meals, monthFilterValue, "No menu has been set for this week yet - check back soon.");
      } else {
        const monthValue = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        const monthName = MONTH_NAMES[now.getMonth()];
        document.title = `GTX Meals - ${monthName} ${now.getFullYear()} Menu`;
        sidebarEl.textContent = monthName.toUpperCase();
        sidebarEl.style.fontSize = "6.21rem";
        wrapEl.style.height = "480px";
        body = sectionsHtml(meals, monthValue, `No menu has been set for ${monthName} ${now.getFullYear()} yet - check back soon.`);
      }

      document.getElementById("menu-body").innerHTML = body;
      document.getElementById("flyer-qr").src =
        `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent("https://gtxmeals.com")}`;
    }

    function wireTextButton(config, token) {
      const textButton = document.getElementById("text-button");
      const dialog = document.getElementById("text-preview-dialog");
      const recipientsEl = document.getElementById("text-preview-recipients");
      const messageEl = document.getElementById("text-preview-message");
      const sendButton = document.getElementById("text-send-button");
      const cancelButton = document.getElementById("text-cancel-button");
      const statusEl = document.getElementById("text-status");

      textButton.style.display = "inline-block";

      const link = `${location.origin}/menu-flyer.html?period=${period}`;
      const message = `Here is our ${period} menu: ${link}`;
      const subject = `GTX Meals - ${period === "weekly" ? "This week's" : "This month's"} menu is up!`;

      textButton.addEventListener("click", async () => {
        statusEl.style.display = "none";
        let customerCount = null;
        try {
          const { customers } = await apiRequest(config.apiUrl, "/customers", { token });
          customerCount = customers.length;
        } catch {
          // Non-fatal - the preview just won't show a recipient count.
        }
        recipientsEl.textContent =
          customerCount === null
            ? "Will be sent to every subscribed customer."
            : `Will be sent to up to ${customerCount} customer${customerCount === 1 ? "" : "s"} (subscribed).`;
        messageEl.value = message;
        dialog.showModal();
      });

      cancelButton.addEventListener("click", () => dialog.close());

      sendButton.addEventListener("click", async () => {
        sendButton.disabled = true;
        try {
          const result = await apiRequest(config.apiUrl, "/menu/send", {
            method: "POST",
            token,
            body: { subject, message },
          });
          dialog.close();
          statusEl.className = "text-status";
          statusEl.textContent =
            `Sent to ${result.sentEmail} by email, ${result.sentText} by text` +
            (result.skippedUnsubscribed ? `, skipped ${result.skippedUnsubscribed} unsubscribed` : "") +
            (result.skippedSmsDisabled ? `, skipped ${result.skippedSmsDisabled} (SMS off)` : "") +
            (result.skippedNoContact ? `, skipped ${result.skippedNoContact} with no contact info` : "") +
            (result.failed ? `, ${result.failed} failed` : "") +
            ".";
          statusEl.style.display = "block";
        } catch (err) {
          dialog.close();
          statusEl.className = "text-status error";
          statusEl.textContent = err.message;
          statusEl.style.display = "block";
        } finally {
          sendButton.disabled = false;
        }
      });
    }

    document.getElementById("cancel-button").addEventListener("click", () => {
      if (history.length > 1) {
        history.back();
      } else {
        location.href = "/index.html";
      }
    });

    loadConfig().then(async (config) => {
      await render(config);
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      if (isAdmin(session)) {
        wireTextButton(config, session.idToken);
      }
    });
  </script>
</body>
</html>
