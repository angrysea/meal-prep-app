<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prep List - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="admin-page">
  <header id="nav"></header>

  <main>
    <h1>Meals to prepare</h1>
    <p class="muted">Total quantity needed for the selected ready date's placed orders, by meal.</p>
    <div id="admin-guard"></div>

    <div id="admin-content" style="display:none;">
      <form class="toolbar" id="print-labels-form">
        <label for="ready-date-filter">Ready date</label>
        <select id="ready-date-filter"></select>
        <button type="submit" id="print-labels-button" disabled>Print labels</button>
        <span class="muted" id="print-labels-hint">
          One label per meal, sized for a standard 3&quot; wide x 2&quot; high label printer.
        </span>
      </form>

      <div class="table-card">
        <table class="data-table" id="prep-table">
          <thead>
            <tr><th>Meal</th><th>Add-ons</th><th>Note</th><th class="num">Quantity</th></tr>
          </thead>
          <tbody id="prep-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Only shown (via @media print in style.css) when printing labels - hidden otherwise. -->
  <div id="print-labels"></div>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest } from "/js/api.js";
    import { getValidSession, isAdmin } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";
    import { formatMacros } from "/js/pricing.js";
    import { showToast } from "/js/toast.js";
    import { enableEnterToSubmit, escapeHtml } from "/js/admin.js";

    renderNav();
    enableEnterToSubmit();

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      const guard = document.getElementById("admin-guard");

      if (!session) {
        guard.innerHTML = `<p class="error">You need to <a href="${loginUrlWithReturnTo()}">log in</a> as an admin to view this page.</p>`;
      } else if (!isAdmin(session)) {
        guard.innerHTML = `<p class="error">Your account doesn't have admin access.</p>`;
      } else {
        document.getElementById("admin-content").style.display = "block";
        initPrepList(config, session.idToken);
      }
    });

    // Tallies quantity per meal + add-on + note combo across every placed
    // order, so the kitchen can see "make 6 Chicken Teriyaki Bowls (2 with
    // Large, 1 hold the cheese)" instead of flipping through each order
    // individually. Keyed by mealId (not name) so it stays correct even if
    // two meals share a name; note is part of the key too, since "hold the
    // cheese" and a plain order of the same meal need separate rows/labels.
    //
    // Add-on macros come from the meal's CURRENT add-on details, not the
    // order's own snapshot: this view aggregates across every matching order
    // for today's cooking, and two orders for the same add-on can carry
    // different snapshotted macros (the meal's nutrition info was edited in
    // between) - showing live values keeps one aggregated row internally
    // consistent instead of reflecting whichever order happened to be seen
    // first. See withLiveMacros.
    //
    // Each meal holds the macros of the WHOLE meal with an add-on
    // ("totalMacros"). Orders placed before that, for meals not yet given
    // add-on macros, keep their snapshotted macros as an extra amount shown
    // on its own line.
    function withLiveMacros(item, mealsById) {
      const details = (mealsById.get(item.mealId) || {}).addOnDetails || {};
      return (item.selectedAddOns || [])
        .map((a) => {
          const live = (details[a.addOnId] || {}).macros;
          return live && Object.values(live).some(Boolean) ? { ...a, totalMacros: live } : a;
        })
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    // The label's macro grid: the add-on version of the meal when there is
    // one, otherwise the regular meal.
    function labelMacros(addOns, mealMacros) {
      const version = addOns.length === 1 && addOns[0].totalMacros;
      return version || mealMacros;
    }

    function aggregateByMeal(orders, mealsById) {
      const totals = new Map();
      orders.forEach((order) => {
        order.items.forEach((item) => {
          const addOns = withLiveMacros(item, mealsById);
          const addOnKey = addOns.map((a) => a.name).join(",");
          const note = item.note || "";
          const key = `${item.mealId}|${addOnKey}|${note}`;
          if (!totals.has(key)) {
            const macros = labelMacros(addOns, (mealsById.get(item.mealId) || {}).macros);
            totals.set(key, { name: item.name, addOns, addOnKey, note, macros, quantity: 0 });
          }
          totals.get(key).quantity += item.quantity;
        });
      });
      return [...totals.values()].sort((a, b) => {
        const byName = a.name.localeCompare(b.name);
        if (byName !== 0) return byName;
        const byAddOns = a.addOnKey.localeCompare(b.addOnKey);
        if (byAddOns !== 0) return byAddOns;
        return a.note.localeCompare(b.note);
      });
    }

    // "Calories: 450 / Protein: 35g / Carbs: 40g / Fat: 15g" stacked
    // vertically next to the logo - matches the physical label format
    // already in use (see 10.12.26 Labels.pdf).
    function macroGridHtml(macros) {
      if (!macros) return "";
      const { calories = 0, proteinG = 0, carbsG = 0, fatG = 0 } = macros;
      if (!calories && !proteinG && !carbsG && !fatG) return "";
      return `<div class="label-macros">
        <div>Calories: ${calories}</div>
        <div>Protein: ${proteinG}g</div>
        <div>Carbs: ${carbsG}g</div>
        <div>Fat: ${fatG}g</div>
      </div>`;
    }

    // "LARGE" when the macro grid already shows the Large meal; for an older
    // order, "CAULIFLOWER RICE: 25 Calories | 1g Protein | ..." - the extra
    // amount it added.
    function addOnLineHtml(addOn) {
      const m = addOn.totalMacros ? {} : addOn.macros || {};
      const parts = [];
      if (m.calories) parts.push(`${m.calories} Calories`);
      if (m.proteinG) parts.push(`${m.proteinG}g Protein`);
      if (m.carbsG) parts.push(`${m.carbsG}g Carbs`);
      if (m.fatG) parts.push(`${m.fatG}g Fat`);
      const name = escapeHtml(addOn.name);
      const text = parts.length ? `${name}: ${parts.join(" | ")}` : name;
      return `<div class="label-addon-line">${text}</div>`;
    }

    // One label per physical meal, built straight from the orders (not the
    // aggregated table rows) so each label can carry its own customer name -
    // 2 Chicken Bowls for 2 different customers means 2 labels, each naming
    // who it's for, not one row worth of identical unlabeled bowls.
    function buildLabelsHtml(orders, mealsById) {
      const labels = [];
      orders.forEach((order) => {
        order.items.forEach((item) => {
          const addOns = withLiveMacros(item, mealsById);
          const macros = labelMacros(addOns, (mealsById.get(item.mealId) || {}).macros);
          for (let i = 0; i < item.quantity; i++) {
            labels.push({
              name: item.name,
              addOns,
              note: item.note || "",
              macros,
              customerName: order.customerName || "",
              pickupName: order.pickupName || "",
            });
          }
        });
      });
      labels.sort((a, b) => {
        const byName = a.name.localeCompare(b.name);
        if (byName !== 0) return byName;
        const addOnKeyA = a.addOns.map((x) => x.name).join(",");
        const addOnKeyB = b.addOns.map((x) => x.name).join(",");
        const byAddOns = addOnKeyA.localeCompare(addOnKeyB);
        if (byAddOns !== 0) return byAddOns;
        const byNote = a.note.localeCompare(b.note);
        if (byNote !== 0) return byNote;
        return a.customerName.localeCompare(b.customerName);
      });
      const labelsHtml = labels.map(
        (row) => `
        <div class="label">
          <div class="label-meal">${escapeHtml(row.name)}</div>
          ${row.customerName ? `<div class="label-customer">${escapeHtml(row.customerName)}${
            row.pickupName ? ` (pickup: ${escapeHtml(row.pickupName)})` : ""
          }</div>` : ""}
          <div class="label-body">
            <img class="label-logo-img" src="/assets/logo.png" alt="GTX Meals" />
            ${macroGridHtml(row.macros)}
          </div>
          ${row.addOns.map(addOnLineHtml).join("")}
          ${row.note ? `<div class="label-note">Note: ${escapeHtml(row.note)}</div>` : ""}
        </div>`
      );

      // SpartanIndustrial R011 sheets hold 10 labels (2 columns x 5 rows) -
      // chunk into one <div class="label-sheet"> per physical sheet, each
      // starting a new printed page, instead of relying on CSS grid to
      // paginate on its own (unreliable across browsers when printing).
      const LABELS_PER_SHEET = 10;
      const sheets = [];
      for (let i = 0; i < labelsHtml.length; i += LABELS_PER_SHEET) {
        sheets.push(labelsHtml.slice(i, i + LABELS_PER_SHEET));
      }
      return {
        html: sheets.map((sheetLabels) => `<div class="label-sheet">${sheetLabels.join("")}</div>`).join(""),
        labelCount: labelsHtml.length,
        sheetCount: sheets.length,
      };
    }

    async function initPrepList(config, token) {
      const body = document.getElementById("prep-body");
      const select = document.getElementById("ready-date-filter");
      const printButton = document.getElementById("print-labels-button");
      let currentOrders = [];

      // Print labels is this page's default button: Enter prints from the
      // ready-date picker (via the toolbar form) and from anywhere else on
      // the page where nothing in particular has focus - e.g. right after
      // it loads. It starts disabled and only enables once orders for the
      // selected date have loaded, so an early Enter is a no-op.
      const printForm = document.getElementById("print-labels-form");
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" || e.repeat || e.isComposing || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
        const nothingFocused = e.target === document.body || e.target === document.documentElement;
        if (!nothingFocused || printButton.disabled) return;
        e.preventDefault();
        printForm.requestSubmit();
      });

      printForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (printButton.disabled) return;
        const { html, labelCount, sheetCount } = buildLabelsHtml(currentOrders, mealsById);
        document.getElementById("print-labels").innerHTML = html;
        window.print();
        showToast(`Sent ${labelCount} label${labelCount === 1 ? "" : "s"} (${sheetCount} sheet${sheetCount === 1 ? "" : "s"}) for ${select.value} to print`);
      });

      const [{ orders }, { nextReadyDate }, { meals }] = await Promise.all([
        apiRequest(config.apiUrl, "/admin/orders?status=placed", { token }),
        apiRequest(config.apiUrl, "/settings", { token }),
        apiRequest(config.apiUrl, "/meals"),
      ]);
      const mealsById = new Map(meals.map((m) => [m.mealId, m]));

      // Orders placed before the ready date last changed may still carry an
      // older date - offer every date actually in play, not just the current
      // one, so none of them get missed.
      const dates = new Set(orders.map((o) => o.readyDate).filter(Boolean));
      if (nextReadyDate) dates.add(nextReadyDate);
      const sortedDates = [...dates].sort();

      if (sortedDates.length === 0) {
        select.style.display = "none";
        document.querySelector('label[for="ready-date-filter"]').style.display = "none";
        printButton.style.display = "none";
        document.getElementById("print-labels-hint").style.display = "none";
        body.innerHTML = `<tr class="empty-row"><td colspan="4">No ready date has been set yet - set one on the Builder page.</td></tr>`;
        return;
      }

      select.innerHTML = sortedDates
        .map((d) => `<option value="${escapeHtml(d)}" ${d === nextReadyDate ? "selected" : ""}>${escapeHtml(d)}</option>`)
        .join("");

      function renderForSelectedDate() {
        const filtered = orders.filter((o) => o.readyDate === select.value);
        currentOrders = filtered;
        if (filtered.length === 0) {
          printButton.disabled = true;
          body.innerHTML = `<tr class="empty-row"><td colspan="4">No placed orders for this date.</td></tr>`;
          return;
        }
        const rows = aggregateByMeal(filtered, mealsById);
        printButton.disabled = false;
        body.innerHTML = rows
          .map(
            (row) => `
          <tr>
            <td><strong>${escapeHtml(row.name)}</strong></td>
            <td>${
              row.addOns.length
                ? row.addOns
                    .map((a) => {
                      const m = formatMacros(a.totalMacros || a.macros);
                      return `<div>${escapeHtml(a.name)}${m ? `<div class="muted" style="font-size:0.75rem;">${m}</div>` : ""}</div>`;
                    })
                    .join("")
                : "-"
            }</td>
            <td>${escapeHtml(row.note) || "-"}</td>
            <td class="num"><strong>${row.quantity}</strong></td>
          </tr>`
          )
          .join("");
      }

      select.addEventListener("change", renderForSelectedDate);
      renderForSelectedDate();
    }
  </script>
</body>
</html>
