<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>Manage menu</h1>
    <div id="admin-guard"></div>

    <div id="admin-content" style="display:none;">
      <section class="card form-narrow">
        <h2>Add a meal</h2>
        <label for="new-name">Name</label>
        <input id="new-name" type="text" />
        <label for="new-description">Description</label>
        <input id="new-description" type="text" />
        <label for="new-price">Base price (USD)</label>
        <input id="new-price" type="number" step="0.01" min="0" />

        <h3>Macros</h3>
        <div style="display:flex; gap:0.5rem;">
          <div style="flex:1;">
            <label for="new-calories">Calories</label>
            <input id="new-calories" type="number" min="0" />
          </div>
          <div style="flex:1;">
            <label for="new-protein">Protein (g)</label>
            <input id="new-protein" type="number" min="0" />
          </div>
          <div style="flex:1;">
            <label for="new-carbs">Carbs (g)</label>
            <input id="new-carbs" type="number" min="0" />
          </div>
          <div style="flex:1;">
            <label for="new-fat">Fat (g)</label>
            <input id="new-fat" type="number" min="0" />
          </div>
        </div>

        <p class="error" id="create-error" style="display:none;"></p>
        <button id="create-button">Add meal</button>
      </section>

      <h2>Current menu</h2>
      <table id="meals-table">
        <thead>
          <tr><th>Name</th><th>Price</th><th>Available</th><th></th></tr>
        </thead>
        <tbody id="meals-body"></tbody>
      </table>

      <section class="card form-narrow">
        <h2>Add-ons <span class="muted" style="font-weight:normal;">(offered on every meal)</span></h2>
        <label for="addon-description">Description</label>
        <input id="addon-description" type="text" placeholder="e.g. Large, Extra Protein" />
        <label for="addon-price">Price (USD)</label>
        <input id="addon-price" type="number" step="0.01" min="0" />
        <p class="error" id="addon-error" style="display:none;"></p>
        <button id="addon-create-button">Add add-on</button>
      </section>

      <h2>Current add-ons</h2>
      <table id="addons-table">
        <thead>
          <tr><th>Description</th><th>Price</th><th></th></tr>
        </thead>
        <tbody id="addons-body"></tbody>
      </table>

      <section class="card form-narrow">
        <h2>Weekly reminders</h2>
        <p class="muted">
          Emails or texts every customer who hasn't unsubscribed, using
          whichever contact method they prefer.
        </p>
        <button id="send-reminders-button">Send weekly reminders</button>
        <p class="error" id="reminders-error" style="display:none;"></p>
        <p class="muted" id="reminders-result" style="display:none;"></p>
      </section>
    </div>
  </main>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession, isAdmin } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";

    renderNav();

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      const guard = document.getElementById("admin-guard");

      if (!session) {
        guard.innerHTML = `<p class="error">You need to <a href="${loginUrlWithReturnTo()}">log in</a> as an admin to view this page.</p>`;
      } else if (!isAdmin(session)) {
        guard.innerHTML = `<p class="error">Your account doesn't have admin access.</p>`;
      } else {
        document.getElementById("admin-content").style.display = "block";
        initAdmin(config, session.idToken);
      }
    });

    async function initAdmin(config, token) {
      async function refreshMeals() {
        const { meals } = await apiRequest(config.apiUrl, "/meals");
        const body = document.getElementById("meals-body");
        body.innerHTML = meals
          .map(
            (meal) => `
          <tr data-meal-id="${meal.mealId}">
            <td>${meal.name}</td>
            <td>${formatPrice(meal.priceCents)}</td>
            <td>${meal.available ? "Yes" : "No"}</td>
            <td>
              <button class="secondary toggle-available">${meal.available ? "Hide" : "Show"}</button>
              <button class="secondary delete-meal">Delete</button>
            </td>
          </tr>`
          )
          .join("");

        body.querySelectorAll(".toggle-available").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const row = e.target.closest("tr");
            const mealId = row.dataset.mealId;
            const meal = meals.find((m) => m.mealId === mealId);
            await apiRequest(config.apiUrl, `/meals/${mealId}`, {
              method: "PUT",
              token,
              body: { available: !meal.available },
            });
            refreshMeals();
          });
        });

        body.querySelectorAll(".delete-meal").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const mealId = e.target.closest("tr").dataset.mealId;
            if (!confirm("Delete this meal?")) return;
            await apiRequest(config.apiUrl, `/meals/${mealId}`, { method: "DELETE", token });
            refreshMeals();
          });
        });
      }

      async function refreshAddOns() {
        const { addOns } = await apiRequest(config.apiUrl, "/addons");
        const body = document.getElementById("addons-body");
        body.innerHTML = addOns
          .map(
            (addOn) => `
          <tr data-addon-id="${addOn.addOnId}">
            <td>${addOn.description}</td>
            <td>${formatPrice(addOn.priceCents)}</td>
            <td><button class="secondary delete-addon">Delete</button></td>
          </tr>`
          )
          .join("");

        body.querySelectorAll(".delete-addon").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const addOnId = e.target.closest("tr").dataset.addonId;
            if (!confirm("Delete this add-on?")) return;
            await apiRequest(config.apiUrl, `/addons/${addOnId}`, { method: "DELETE", token });
            refreshAddOns();
          });
        });
      }

      document.getElementById("create-button").addEventListener("click", async () => {
        const errorEl = document.getElementById("create-error");
        errorEl.style.display = "none";
        try {
          const priceCents = Math.round(parseFloat(document.getElementById("new-price").value) * 100);
          await apiRequest(config.apiUrl, "/meals", {
            method: "POST",
            token,
            body: {
              name: document.getElementById("new-name").value,
              description: document.getElementById("new-description").value,
              priceCents,
              macros: {
                calories: parseInt(document.getElementById("new-calories").value, 10) || 0,
                proteinG: parseInt(document.getElementById("new-protein").value, 10) || 0,
                carbsG: parseInt(document.getElementById("new-carbs").value, 10) || 0,
                fatG: parseInt(document.getElementById("new-fat").value, 10) || 0,
              },
            },
          });
          document.getElementById("new-name").value = "";
          document.getElementById("new-description").value = "";
          document.getElementById("new-price").value = "";
          document.getElementById("new-calories").value = "";
          document.getElementById("new-protein").value = "";
          document.getElementById("new-carbs").value = "";
          document.getElementById("new-fat").value = "";
          refreshMeals();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
        }
      });

      document.getElementById("addon-create-button").addEventListener("click", async () => {
        const errorEl = document.getElementById("addon-error");
        errorEl.style.display = "none";
        try {
          const priceCents = Math.round(parseFloat(document.getElementById("addon-price").value) * 100);
          await apiRequest(config.apiUrl, "/addons", {
            method: "POST",
            token,
            body: {
              description: document.getElementById("addon-description").value,
              priceCents,
            },
          });
          document.getElementById("addon-description").value = "";
          document.getElementById("addon-price").value = "";
          refreshAddOns();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
        }
      });

      document.getElementById("send-reminders-button").addEventListener("click", async () => {
        const errorEl = document.getElementById("reminders-error");
        const resultEl = document.getElementById("reminders-result");
        errorEl.style.display = "none";
        resultEl.style.display = "none";
        if (!confirm("Send a weekly reminder to every subscribed customer now?")) return;
        try {
          const result = await apiRequest(config.apiUrl, "/reminders/send", { method: "POST", token });
          resultEl.textContent =
            `Sent ${result.sentEmail} email(s), ${result.sentText} text(s). ` +
            `Skipped ${result.skippedUnsubscribed} unsubscribed. ${result.failed} failed.` +
            (result.errors.length ? ` First error: ${result.errors[0]}` : "");
          resultEl.style.display = "block";
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
        }
      });

      refreshMeals();
      refreshAddOns();
    }
  </script>
</body>
</html>
