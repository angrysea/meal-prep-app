<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="admin-page">
  <header id="nav"></header>

  <main>
    <h1>Orders</h1>
    <div id="admin-guard"></div>

    <div id="admin-content" style="display:none;">
      <div class="toolbar">
        <label for="status-filter">Show</label>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="placed" selected>Placed</option>
          <option value="prepared">Prepared</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <span class="toolbar-spacer"></span>
        <span class="muted" id="orders-count"></span>
      </div>

      <div class="table-card">
        <table class="data-table" id="orders-table">
          <thead>
            <tr>
              <th>Placed</th><th>Customer</th><th>Contact</th><th>Ready date</th>
              <th>Items</th><th class="num">Total</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession, isAdmin } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";
    import { formatMacros } from "/js/pricing.js";
    import { showToast } from "/js/toast.js";
    import { escapeHtml } from "/js/admin.js";

    renderNav();

    const STATUSES = ["placed", "cancelled", "prepared", "delivered"];

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      const guard = document.getElementById("admin-guard");

      if (!session) {
        guard.innerHTML = `<p class="error">You need to <a href="${loginUrlWithReturnTo()}">log in</a> as an admin to view this page.</p>`;
      } else if (!isAdmin(session)) {
        guard.innerHTML = `<p class="error">Your account doesn't have admin access.</p>`;
      } else {
        document.getElementById("admin-content").style.display = "block";
        initOrders(config, session.idToken);
      }
    });

    function itemsHtml(items) {
      return `<ul>${items
        .map((i) => {
          const addOnParts = (i.selectedAddOns || []).map((a) => {
            const macrosText = formatMacros(a.macros);
            return `${escapeHtml(a.description)}${macrosText ? ` [${macrosText}]` : ""}`;
          });
          const addOnText = addOnParts.length ? ` <span class="muted">(${addOnParts.join(", ")})</span>` : "";
          const noteText = i.note ? ` <span class="muted">- Note: ${escapeHtml(i.note)}</span>` : "";
          return `<li>${i.quantity} x ${escapeHtml(i.name)}${addOnText} - ${formatPrice(i.unitPriceCents * i.quantity)}${noteText}</li>`;
        })
        .join("")}</ul>`;
    }

    function initOrders(config, token) {
      const filterSelect = document.getElementById("status-filter");
      const body = document.getElementById("orders-body");
      const countEl = document.getElementById("orders-count");

      async function refresh() {
        const filter = filterSelect.value;
        const { orders } = await apiRequest(config.apiUrl, `/admin/orders?status=${encodeURIComponent(filter)}`, { token });
        countEl.textContent = `${orders.length} order${orders.length === 1 ? "" : "s"}`;

        if (orders.length === 0) {
          body.innerHTML = `<tr class="empty-row"><td colspan="7">${
            filter === "all" ? "No orders yet." : `No orders in ${escapeHtml(filter)} status right now.`
          }</td></tr>`;
          return;
        }

        body.innerHTML = orders
          .map((order) => {
            const createdAt = new Date(order.createdAt).toLocaleString();
            return `
          <tr data-order-id="${escapeHtml(order.orderId)}" data-customer-sub="${escapeHtml(order.customerSub)}">
            <td style="white-space:nowrap;">${escapeHtml(createdAt)}</td>
            <td><strong>${escapeHtml(order.deliveryName)}</strong><div class="cell-sub">${escapeHtml(order.deliveryAddress)}</div></td>
            <td>${escapeHtml(order.deliveryEmail)}${order.deliveryPhone ? `<div class="cell-sub">${escapeHtml(order.deliveryPhone)}</div>` : ""}</td>
            <td style="white-space:nowrap;">${escapeHtml(order.readyDate) || "-"}</td>
            <td>${itemsHtml(order.items)}</td>
            <td class="num"><strong>${formatPrice(order.totalCents)}</strong></td>
            <td>
              <select class="status-select" aria-label="Status for ${escapeHtml(order.deliveryName)}'s order placed ${escapeHtml(createdAt)}">
                ${STATUSES.map((s) => `<option value="${s}" ${s === order.status ? "selected" : ""}>${s}</option>`).join("")}
              </select>
            </td>
          </tr>`;
          })
          .join("");

        body.querySelectorAll(".status-select").forEach((select) => {
          const original = select.value;
          select.addEventListener("change", async (e) => {
            const row = e.target.closest("tr");
            const { orderId, customerSub } = row.dataset;
            const order = orders.find((o) => o.orderId === orderId);
            const status = select.value;
            select.disabled = true;
            try {
              await apiRequest(config.apiUrl, `/admin/orders/${customerSub}/${orderId}`, {
                method: "PUT",
                token,
                body: { status },
              });
              showToast(`Order for ${order.deliveryName || order.deliveryEmail} marked ${status}`);
              refresh();
            } catch (err) {
              // Put the dropdown back so it doesn't show a status that never saved.
              select.value = original;
              select.disabled = false;
              showToast(err.message, { error: true });
            }
          });
        });
      }

      filterSelect.addEventListener("change", refresh);
      refresh();
    }
  </script>
</body>
</html>
