<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>This Week's Menu</h1>
    <p class="muted">Pick your meals, then check out below.</p>

    <div id="meals" class="meal-grid">
      <p class="muted">Loading menu...</p>
    </div>

    <section class="card" id="cart-section" style="display:none;">
      <h2>Your order</h2>
      <div id="cart-lines"></div>
      <p><strong>Total: <span id="cart-total">$0.00</span></strong></p>

      <div id="checkout-form">
        <label for="delivery-name">Name</label>
        <input id="delivery-name" type="text" placeholder="Your name" />

        <label for="delivery-address">Delivery address</label>
        <input id="delivery-address" type="text" placeholder="123 Main St" />

        <p class="error" id="checkout-error" style="display:none;"></p>
        <button id="checkout-button">Place order</button>
        <p class="muted" id="checkout-note">
          This is a demo checkout - no payment is actually charged.
        </p>
      </div>
    </section>
  </main>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { computeUnitPriceCents, describeSelections, selectionsKey } from "/js/pricing.js";

    renderNav();

    const cart = {}; // selectionsKey -> { meal, selectedOptions, quantity }

    function renderCart() {
      const section = document.getElementById("cart-section");
      const lines = document.getElementById("cart-lines");
      const entries = Object.values(cart);

      if (entries.length === 0) {
        section.style.display = "none";
        return;
      }
      section.style.display = "block";

      let total = 0;
      lines.innerHTML = entries
        .map(({ meal, selectedOptions, quantity }) => {
          const unitPrice = computeUnitPriceCents(meal, selectedOptions);
          total += unitPrice * quantity;
          const optionLabels = describeSelections(meal, selectedOptions);
          const optionText = optionLabels.length ? `<div class="muted" style="font-size:0.85rem;">${optionLabels.join(", ")}</div>` : "";
          return `<div class="cart-line-wrap">
            <div class="cart-line"><span>${quantity} x ${meal.name}</span><span>${formatPrice(unitPrice * quantity)}</span></div>
            ${optionText}
          </div>`;
        })
        .join("");
      document.getElementById("cart-total").textContent = formatPrice(total);
    }

    function addToCart(meal, selectedOptions) {
      const key = selectionsKey(meal.mealId, selectedOptions);
      if (!cart[key]) {
        cart[key] = { meal, selectedOptions, quantity: 0 };
      }
      cart[key].quantity += 1;
      renderCart();
    }

    function renderMacros(macros) {
      if (!macros) return "";
      const parts = [];
      if (macros.calories) parts.push(`${macros.calories} cal`);
      if (macros.proteinG) parts.push(`${macros.proteinG}g protein`);
      if (macros.carbsG) parts.push(`${macros.carbsG}g carbs`);
      if (macros.fatG) parts.push(`${macros.fatG}g fat`);
      return parts.length ? `<p class="macros muted">${parts.join(" &middot; ")}</p>` : "";
    }

    function renderOptionGroups(meal) {
      const groups = meal.optionGroups || [];
      if (groups.length === 0) return "";
      return `<div class="option-groups">${groups
        .map(
          (g) => `
        <div class="option-group" data-group-id="${g.id}">
          <strong>${g.name}${g.required ? " *" : ""}</strong>
          ${g.options
            .map(
              (o) => `
            <label class="option-choice">
              <input type="${g.selectionType === "single" ? "radio" : "checkbox"}" name="${g.id}-${meal.mealId}" value="${o.id}" />
              ${o.label}${o.priceDeltaCents ? ` (+${formatPrice(o.priceDeltaCents)})` : ""}
            </label>`
            )
            .join("")}
        </div>`
        )
        .join("")}</div>`;
    }

    function readSelectedOptions(cardEl, meal) {
      const selections = [];
      cardEl.querySelectorAll(".option-group").forEach((groupEl) => {
        const groupId = groupEl.dataset.groupId;
        groupEl.querySelectorAll("input:checked").forEach((input) => {
          selections.push({ groupId, optionId: input.value });
        });
      });
      return selections;
    }

    function validateRequiredGroups(meal, selections) {
      const selectedGroupIds = new Set(selections.map((s) => s.groupId));
      const missing = (meal.optionGroups || []).filter((g) => g.required && !selectedGroupIds.has(g.id));
      return missing;
    }

    async function loadMeals(config) {
      const container = document.getElementById("meals");
      try {
        const { meals } = await apiRequest(config.apiUrl, "/meals");
        const available = meals.filter((m) => m.available);
        if (available.length === 0) {
          container.innerHTML = `<p class="muted">No meals on the menu right now - check back soon.</p>`;
          return;
        }
        container.innerHTML = available
          .map(
            (meal) => `
          <div class="card meal-card" data-meal-id="${meal.mealId}">
            <h3>${meal.name}</h3>
            <p class="description">${meal.description || ""}</p>
            ${renderMacros(meal.macros)}
            <p class="price">${formatPrice(meal.priceCents)}</p>
            ${renderOptionGroups(meal)}
            <p class="error option-error" style="display:none;"></p>
            <button class="add-to-order" data-meal-id="${meal.mealId}">Add to order</button>
          </div>`
          )
          .join("");

        container.querySelectorAll("button.add-to-order").forEach((btn) => {
          btn.addEventListener("click", () => {
            const cardEl = btn.closest(".meal-card");
            const meal = available.find((m) => m.mealId === btn.dataset.mealId);
            const selections = readSelectedOptions(cardEl, meal);
            const missing = validateRequiredGroups(meal, selections);
            const errorEl = cardEl.querySelector(".option-error");
            if (missing.length > 0) {
              errorEl.textContent = `Please choose a ${missing[0].name.toLowerCase()}.`;
              errorEl.style.display = "block";
              return;
            }
            errorEl.style.display = "none";
            addToCart(meal, selections);
          });
        });
      } catch (err) {
        container.innerHTML = `<p class="error">Couldn't load the menu: ${err.message}</p>`;
      }
    }

    async function placeOrder(config) {
      const errorEl = document.getElementById("checkout-error");
      errorEl.style.display = "none";

      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      if (!session) {
        window.location.href = "/login.html";
        return;
      }

      const items = Object.values(cart).map(({ meal, selectedOptions, quantity }) => ({
        mealId: meal.mealId,
        quantity,
        selectedOptions,
      }));

      try {
        await apiRequest(config.apiUrl, "/orders", {
          method: "POST",
          token: session.idToken,
          body: {
            items,
            deliveryName: document.getElementById("delivery-name").value,
            deliveryAddress: document.getElementById("delivery-address").value,
          },
        });
        window.location.href = "/orders.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    }

    loadConfig().then((config) => {
      loadMeals(config);
      document.getElementById("checkout-button").addEventListener("click", () => placeOrder(config));
    });
  </script>
</body>
</html>
