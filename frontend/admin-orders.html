<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="admin-page">
  <header id="nav"></header>

  <main>
    <h1>Orders</h1>
    <div id="admin-guard"></div>

    <div id="admin-content" style="display:none;">
      <div class="toolbar">
        <label for="ready-date-filter">Ready date</label>
        <select id="ready-date-filter">
          <option value="all" selected>All dates</option>
        </select>
        <label for="status-filter">Show</label>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="placed" selected>Placed</option>
          <option value="prepared">Prepared</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <label for="payment-filter">Payment</label>
        <select id="payment-filter">
          <option value="all" selected>All</option>
          <option value="unpaid">Unpaid only</option>
        </select>
        <span class="toolbar-spacer"></span>
        <span class="muted" id="orders-count"></span>
        <button type="button" class="secondary" id="export-orders" disabled>Export to Excel</button>
      </div>

      <div class="table-card">
        <table class="data-table" id="orders-table">
          <thead>
            <tr>
              <th>Placed</th><th>Customer</th><th>Phone</th><th>Ready date</th>
              <th>Items</th><th class="num">Total</th><th>Payment</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession, isAdmin } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";
    import { formatMacros, PAYMENT_LABELS, amountPaidCents, balanceCents } from "/js/pricing.js";

    // Under the amount paid: what's still owed, or to refund.
    function balanceHtml(order) {
      const balance = balanceCents(order);
      if (balance > 0) return `<div class="payment-balance is-due">Due ${formatPrice(balance)}</div>`;
      if (balance < 0) return `<div class="payment-balance is-refund">Refund ${formatPrice(-balance)}</div>`;
      return "";
    }
    import { showToast } from "/js/toast.js";
    import { confirmAction, escapeHtml } from "/js/admin.js";
    import { ordersToCsv, downloadCsv } from "/js/ordersExport.js";

    renderNav();

    const STATUSES = ["placed", "cancelled", "prepared", "delivered"];

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      const guard = document.getElementById("admin-guard");

      if (!session) {
        guard.innerHTML = `<p class="error">You need to <a href="${loginUrlWithReturnTo()}">log in</a> as an admin to view this page.</p>`;
      } else if (!isAdmin(session)) {
        guard.innerHTML = `<p class="error">Your account doesn't have admin access.</p>`;
      } else {
        document.getElementById("admin-content").style.display = "block";
        initOrders(config, session.idToken);
      }
    });

    function itemsHtml(items, extras = []) {
      // Extras & sauces after the meals, one line each.
      const extraLines = extras
        .map((e) => {
          const macrosText = formatMacros(e.macros);
          return `<li class="order-extra">${e.quantity} x ${escapeHtml(e.name)} - ${formatPrice(e.priceCents * e.quantity)}${
            e.description ? `<div class="item-addon muted">${escapeHtml(e.description)}</div>` : ""
          }${macrosText ? `<div class="item-addon muted">${macrosText} each</div>` : ""}</li>`;
        })
        .join("");
      return `<ul>${items
        .map((i) => {
          // The chosen add-on gets its own line under the item, then the note.
          const addOnLines = (i.selectedAddOns || [])
            .map((a) => {
              const macrosText = formatMacros(a.macros);
              return `<div class="item-addon">+ ${escapeHtml(a.name)}${
                macrosText ? ` <span class="muted">${macrosText}</span>` : ""
              }</div>`;
            })
            .join("");
          const noteText = i.note ? `<div class="item-addon muted">Note: ${escapeHtml(i.note)}</div>` : "";
          return `<li>${i.quantity} x ${escapeHtml(i.name)} - ${formatPrice(i.unitPriceCents * i.quantity)}${addOnLines}${noteText}</li>`;
        })
        .join("")}${extraLines}</ul>`;
    }

    function initOrders(config, token) {
      const filterSelect = document.getElementById("status-filter");
      const body = document.getElementById("orders-body");
      const countEl = document.getElementById("orders-count");
      const dateSelect = document.getElementById("ready-date-filter");
      const paymentSelect = document.getElementById("payment-filter");
      const exportButton = document.getElementById("export-orders");
      // The orders on screen right now - what Export to Excel saves.
      let shownOrders = [];

      // Every ready date seen so far (plus the current next ready date), so
      // a date doesn't drop out of the list just because the Show filter
      // currently has no orders for it. Same dates the Prep List offers.
      const knownDates = new Set();

      function renderDateOptions() {
        const selected = dateSelect.value;
        dateSelect.innerHTML =
          `<option value="all">All dates</option>` +
          [...knownDates].sort().map((d) => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
        dateSelect.value = knownDates.has(selected) ? selected : "all";
      }

      apiRequest(config.apiUrl, "/settings", { token })
        .then(({ nextReadyDate }) => {
          if (nextReadyDate) {
            knownDates.add(nextReadyDate);
            renderDateOptions();
          }
        })
        .catch(() => {
          // Non-fatal - the list still has every date found on an order.
        });

      function emptyMessage(status, date) {
        if (status === "all" && date === "all") return "No orders yet.";
        if (date === "all") return `No orders in ${status} status right now.`;
        if (status === "all") return `No orders for ${date}.`;
        return `No orders in ${status} status for ${date}.`;
      }

      async function refresh() {
        const filter = filterSelect.value;
        const { orders: fetched } = await apiRequest(config.apiUrl, `/admin/orders?status=${encodeURIComponent(filter)}`, { token });
        fetched.forEach((o) => o.readyDate && knownDates.add(o.readyDate));
        renderDateOptions();
        const date = dateSelect.value;
        const unpaidOnly = paymentSelect.value === "unpaid";
        const orders = fetched
          .filter((o) => date === "all" || o.readyDate === date)
          .filter((o) => !unpaidOnly || (o.payment || "unpaid") === "unpaid");
        countEl.textContent = `${orders.length} order${orders.length === 1 ? "" : "s"}`;
        shownOrders = orders;
        exportButton.disabled = orders.length === 0;

        if (orders.length === 0) {
          const message = unpaidOnly && fetched.length ? "No unpaid orders here." : emptyMessage(filter, date);
          body.innerHTML = `<tr class="empty-row"><td colspan="8">${escapeHtml(message)}</td></tr>`;
          return;
        }

        body.innerHTML = orders
          .map((order) => {
            const createdAt = new Date(order.createdAt).toLocaleString();
            return `
          <tr data-order-id="${escapeHtml(order.orderId)}" data-customer-sub="${escapeHtml(order.customerSub)}">
            <td style="white-space:nowrap;">${escapeHtml(createdAt)}</td>
            <td>
              <strong>${escapeHtml(order.customerName)}</strong>
              ${order.pickupName ? `<div class="pickup-by">Pickup: ${escapeHtml(order.pickupName)}</div>` : ""}
            </td>
            <td class="nowrap">${escapeHtml(order.contactPhone) || "-"}</td>
            <td style="white-space:nowrap;">${escapeHtml(order.readyDate) || "-"}</td>
            <td>${itemsHtml(order.items, order.extras || [])}</td>
            <td class="num"><strong>${formatPrice(order.totalCents)}</strong></td>
            <td>
              <select class="payment-select${(order.payment || "unpaid") === "unpaid" ? " is-unpaid" : ""}"
                      aria-label="Payment for ${escapeHtml(order.customerName)}'s order placed ${escapeHtml(createdAt)}">
                ${Object.entries(PAYMENT_LABELS)
                  .map(([value, label]) => `<option value="${value}" ${value === (order.payment || "unpaid") ? "selected" : ""}>${label}</option>`)
                  .join("")}
              </select>
              <label class="amount-paid">Paid $
                <input type="number" class="amount-paid-input" min="0" step="0.01"
                       value="${(amountPaidCents(order) / 100).toFixed(2)}"
                       ${["venmo", "cash"].includes(order.payment) ? "" : "disabled"}
                       aria-label="Amount paid for ${escapeHtml(order.customerName)}'s order placed ${escapeHtml(createdAt)}" />
              </label>
              ${balanceHtml(order)}
            </td>
            <td>
              <select class="status-select" aria-label="Status for ${escapeHtml(order.customerName)}'s order placed ${escapeHtml(createdAt)}">
                ${STATUSES.map((s) => `<option value="${s}" ${s === order.status ? "selected" : ""}>${s}</option>`).join("")}
              </select>
            </td>
          </tr>`;
          })
          .join("");

        // Cancelling emails the customer (and the admin, if a refund is due),
        // so it's confirmed first rather than saved on a stray click.
        const confirmCancel = (order) => {
          const paid = amountPaidCents(order);
          return confirmAction(
            `Cancel ${order.customerName}'s order (${formatPrice(order.totalCents)})? ` +
              "They'll be emailed that it's canceled." +
              (paid ? ` They've paid ${formatPrice(paid)} - you'll get a refund reminder email.` : ""),
            { confirmLabel: "Cancel order", cancelLabel: "Keep order" }
          );
        };

        // Status and payment drop-downs save the same way - one field each.
        const wire = (selector, field, toastFor, confirmFirst) =>
          body.querySelectorAll(selector).forEach((select) => {
            const original = select.value;
            select.addEventListener("change", async (e) => {
              const row = e.target.closest("tr");
              const { orderId, customerSub } = row.dataset;
              const order = orders.find((o) => o.orderId === orderId);
              const value = select.value;
              if (confirmFirst && !(await confirmFirst(order, value))) {
                select.value = original; // kept as it was
                return;
              }
              select.disabled = true;
              try {
                await apiRequest(config.apiUrl, `/admin/orders/${customerSub}/${orderId}`, {
                  method: "PUT",
                  token,
                  body: { [field]: value },
                });
                showToast(toastFor(order, value));
                refresh();
              } catch (err) {
                // Put the dropdown back so it doesn't show a value that never saved.
                select.value = original;
                select.disabled = false;
                showToast(err.message, { error: true });
              }
            });
          });
        wire(
          ".status-select",
          "status",
          (order, status) => `Order for ${order.customerName} marked ${status}`,
          (order, status) => status !== "cancelled" || confirmCancel(order)
        );
        wire(".payment-select", "payment", (order, payment) =>
          `Order for ${order.customerName} marked ${PAYMENT_LABELS[payment].toLowerCase()}`
        );
        // Amount paid saves when the field is left or Enter is pressed.
        body.querySelectorAll(".amount-paid-input").forEach((input) => {
          const original = input.value;
          input.addEventListener("keydown", (e) => e.key === "Enter" && input.blur());
          input.addEventListener("change", async (e) => {
            const row = e.target.closest("tr");
            const { orderId, customerSub } = row.dataset;
            const order = orders.find((o) => o.orderId === orderId);
            const cents = Math.round(parseFloat(input.value || "0") * 100);
            if (!Number.isFinite(cents) || cents < 0) {
              input.value = original;
              showToast("Enter the amount paid in dollars, e.g. 25.00", { error: true });
              return;
            }
            input.disabled = true;
            try {
              await apiRequest(config.apiUrl, `/admin/orders/${customerSub}/${orderId}`, {
                method: "PUT",
                token,
                body: { amountPaidCents: cents },
              });
              showToast(`Recorded ${formatPrice(cents)} paid for ${order.customerName}'s order`);
              refresh();
            } catch (err) {
              input.value = original;
              input.disabled = false;
              showToast(err.message, { error: true });
            }
          });
        });
      }

      // Exports exactly what the filters show. Emails come from the customer
      // list; if it can't load, the file still saves with that column blank.
      exportButton.addEventListener("click", async () => {
        exportButton.disabled = true;
        try {
          const { customers } = await apiRequest(config.apiUrl, "/customers", { token }).catch(() => ({ customers: [] }));
          const emailsBySub = new Map(customers.map((c) => [c.username, c.email]));
          const date = dateSelect.value === "all" ? "all dates" : dateSelect.value;
          const status = filterSelect.value === "all" ? "" : ` ${filterSelect.value}`;
          downloadCsv(`GTX Meals orders - ${date}${status}.csv`, ordersToCsv(shownOrders, emailsBySub));
        } finally {
          exportButton.disabled = shownOrders.length === 0;
        }
      });

      filterSelect.addEventListener("change", refresh);
      paymentSelect.addEventListener("change", refresh);
      dateSelect.addEventListener("change", refresh);
      refresh();
    }
  </script>
</body>
</html>
