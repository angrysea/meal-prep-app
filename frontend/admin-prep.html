<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prep List - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>Meals to prepare</h1>
    <p class="muted">Total quantity needed for the selected ready date's placed orders, by meal.</p>
    <div id="admin-guard"></div>

    <div id="admin-content" style="display:none;">
      <label for="ready-date-filter">Ready date</label>
      <select id="ready-date-filter" style="max-width:220px;"></select>
      <button type="button" class="secondary" id="print-labels-button" style="margin-left:0.5rem;">Print labels</button>
      <p class="muted" id="print-labels-hint">
        One label per meal, sized for a standard 3&quot; wide x 2&quot; high label printer.
      </p>

      <table id="prep-table">
        <thead>
          <tr><th>Meal</th><th>Add-ons</th><th>Quantity</th></tr>
        </thead>
        <tbody id="prep-body"></tbody>
      </table>
    </div>
  </main>

  <!-- Only shown (via @media print in style.css) when printing labels - hidden otherwise. -->
  <div id="print-labels"></div>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest } from "/js/api.js";
    import { getValidSession, isAdmin } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";

    renderNav();

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      const guard = document.getElementById("admin-guard");

      if (!session) {
        guard.innerHTML = `<p class="error">You need to <a href="${loginUrlWithReturnTo()}">log in</a> as an admin to view this page.</p>`;
      } else if (!isAdmin(session)) {
        guard.innerHTML = `<p class="error">Your account doesn't have admin access.</p>`;
      } else {
        document.getElementById("admin-content").style.display = "block";
        initPrepList(config, session.idToken);
      }
    });

    // Same macro line format as the customer-facing menu cards.
    function formatMacros(macros) {
      if (!macros) return "";
      const parts = [];
      if (macros.calories) parts.push(`${macros.calories} cal`);
      if (macros.proteinG) parts.push(`${macros.proteinG}g protein`);
      if (macros.carbsG) parts.push(`${macros.carbsG}g carbs`);
      if (macros.fatG) parts.push(`${macros.fatG}g fat`);
      return parts.join(" &middot; ");
    }

    // Tallies quantity per meal + add-on combo across every placed order, so
    // the kitchen can see "make 6 Chicken Teriyaki Bowls (2 with Large)"
    // instead of flipping through each order individually. Keyed by mealId
    // (not name) so it stays correct even if two meals share a name.
    function aggregateByMeal(orders, mealsById) {
      const totals = new Map();
      orders.forEach((order) => {
        order.items.forEach((item) => {
          const addOnLabels = (item.selectedAddOns || []).map((a) => a.description).sort();
          const key = `${item.mealId}|${addOnLabels.join(",")}`;
          if (!totals.has(key)) {
            const macros = (mealsById.get(item.mealId) || {}).macros;
            totals.set(key, { name: item.name, addOnLabels, macros, quantity: 0 });
          }
          totals.get(key).quantity += item.quantity;
        });
      });
      return [...totals.values()].sort((a, b) => {
        const byName = a.name.localeCompare(b.name);
        if (byName !== 0) return byName;
        return a.addOnLabels.join(",").localeCompare(b.addOnLabels.join(","));
      });
    }

    // One label per physical meal, not per aggregated row - 2 Chicken Bowls
    // means 2 separate labels to stick on 2 separate containers.
    function buildLabelsHtml(rows) {
      const labels = [];
      rows.forEach((row) => {
        for (let i = 0; i < row.quantity; i++) labels.push(row);
      });
      return labels
        .map((row) => {
          const macrosText = formatMacros(row.macros);
          return `
        <div class="label">
          <img src="/assets/logo.png" alt="GTX Meals" />
          <div class="label-brand">GTX MEALS</div>
          <div class="label-meal">${row.name}</div>
          ${row.addOnLabels.length ? `<div class="label-addons">${row.addOnLabels.join(", ")}</div>` : ""}
          ${macrosText ? `<div class="label-macros">${macrosText}</div>` : ""}
        </div>`;
        })
        .join("");
    }

    async function initPrepList(config, token) {
      const body = document.getElementById("prep-body");
      const select = document.getElementById("ready-date-filter");
      const printButton = document.getElementById("print-labels-button");
      let currentRows = [];

      printButton.addEventListener("click", () => {
        document.getElementById("print-labels").innerHTML = buildLabelsHtml(currentRows);
        window.print();
      });

      const [{ orders }, { nextReadyDate }, { meals }] = await Promise.all([
        apiRequest(config.apiUrl, "/admin/orders?status=placed", { token }),
        apiRequest(config.apiUrl, "/settings", { token }),
        apiRequest(config.apiUrl, "/meals"),
      ]);
      const mealsById = new Map(meals.map((m) => [m.mealId, m]));

      // Orders placed before the ready date last changed may still carry an
      // older date - offer every date actually in play, not just the current
      // one, so none of them get missed.
      const dates = new Set(orders.map((o) => o.readyDate).filter(Boolean));
      if (nextReadyDate) dates.add(nextReadyDate);
      const sortedDates = [...dates].sort();

      if (sortedDates.length === 0) {
        select.style.display = "none";
        document.querySelector('label[for="ready-date-filter"]').style.display = "none";
        printButton.style.display = "none";
        document.getElementById("print-labels-hint").style.display = "none";
        body.innerHTML = `<tr><td colspan="3" class="muted">No ready date has been set yet - set one on the Builder page.</td></tr>`;
        return;
      }

      select.innerHTML = sortedDates
        .map((d) => `<option value="${d}" ${d === nextReadyDate ? "selected" : ""}>${d}</option>`)
        .join("");

      function renderForSelectedDate() {
        const filtered = orders.filter((o) => o.readyDate === select.value);
        if (filtered.length === 0) {
          currentRows = [];
          printButton.disabled = true;
          body.innerHTML = `<tr><td colspan="3" class="muted">No placed orders for this date.</td></tr>`;
          return;
        }
        const rows = aggregateByMeal(filtered, mealsById);
        currentRows = rows;
        printButton.disabled = false;
        body.innerHTML = rows
          .map(
            (row) => `
          <tr>
            <td>${row.name}</td>
            <td>${row.addOnLabels.length ? row.addOnLabels.join(", ") : "-"}</td>
            <td>${row.quantity}</td>
          </tr>`
          )
          .join("");
      }

      select.addEventListener("change", renderForSelectedDate);
      renderForSelectedDate();
    }
  </script>
</body>
</html>
