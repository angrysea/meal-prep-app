<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Orders - GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>My orders</h1>
    <div id="orders">
      <p class="muted">Loading...</p>
    </div>
  </main>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";

    renderNav();

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      if (!session) {
        window.location.href = loginUrlWithReturnTo();
        return;
      }

      const container = document.getElementById("orders");

      async function refresh() {
        const { orders } = await apiRequest(config.apiUrl, "/orders", { token: session.idToken });
        if (orders.length === 0) {
          container.innerHTML = `<p class="muted">No orders yet. <a href="/index.html">Browse the menu</a>.</p>`;
          return;
        }
        container.innerHTML = orders
          .map(
            (order) => `
          <div class="card order-card" data-order-id="${order.orderId}">
            <p><strong>${new Date(order.createdAt).toLocaleString()}</strong>
              &nbsp;<span class="status">${order.status}</span></p>
            <ul>
              ${order.items
                .map((i) => {
                  const addOnLabels = (i.selectedAddOns || []).map((a) => a.description);
                  const addOnText = addOnLabels.length ? ` <span class="muted">(${addOnLabels.join(", ")})</span>` : "";
                  return `<li>${i.quantity} x ${i.name}${addOnText} - ${formatPrice(i.unitPriceCents * i.quantity)}</li>`;
                })
                .join("")}
            </ul>
            <p>Total: <strong>${formatPrice(order.totalCents)}</strong></p>
            <p class="muted">${order.deliveryName} - ${order.deliveryAddress}</p>
            <p class="muted">${order.deliveryEmail}${order.deliveryPhone ? ` - ${order.deliveryPhone}` : ""}</p>
            ${order.status === "placed" ? `<button class="secondary edit-order">Edit</button>` : ""}
          </div>`
          )
          .join("");

        container.querySelectorAll(".edit-order").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const orderId = e.target.closest(".order-card").dataset.orderId;
            const order = orders.find((o) => o.orderId === orderId);
            await apiRequest(config.apiUrl, `/orders/${orderId}`, {
              method: "PUT",
              token: session.idToken,
              body: { status: "cancelled" },
            });
            sessionStorage.setItem(
              "editOrderCart",
              JSON.stringify({
                items: order.items.map((i) => ({
                  mealId: i.mealId,
                  quantity: i.quantity,
                  selectedAddOnIds: (i.selectedAddOns || []).map((a) => a.addOnId),
                })),
                delivery: {
                  name: order.deliveryName,
                  email: order.deliveryEmail,
                  phone: order.deliveryPhone,
                  address: order.deliveryAddress,
                },
              })
            );
            window.location.href = "/index.html";
          });
        });
      }

      try {
        await refresh();
      } catch (err) {
        container.innerHTML = `<p class="error">Couldn't load your orders: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
