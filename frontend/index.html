<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTX Meals</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>This Week's Menu</h1>
    <p class="muted">Pick your meals, then check out below.</p>
    <button type="button" class="secondary" id="monthly-menu-button">View this month's menu</button>
    <p class="muted" id="ready-date-info" style="display:none;"></p>
    <p class="muted" id="login-prompt" style="display:none;"></p>
    <p class="muted" id="edit-notice" style="display:none;">Editing your previous order - update it below and place it again.</p>

    <div id="meals" class="meal-grid">
      <p class="muted">Loading menu...</p>
    </div>

    <section class="card" id="cart-section" style="display:none;">
      <div id="cart-lines"></div>
      <p><strong>Total: <span id="cart-total">$0.00</span></strong></p>

      <div id="checkout-form">
        <label for="delivery-name">Name</label>
        <input id="delivery-name" type="text" placeholder="Your name" />

        <label for="delivery-email">Email</label>
        <input id="delivery-email" type="email" placeholder="you@example.com" />

        <label for="delivery-phone">Phone</label>
        <input id="delivery-phone" type="tel" placeholder="555-123-4567" />

        <label for="delivery-address">Delivery address</label>
        <input id="delivery-address" type="text" placeholder="123 Main St" />

        <p class="muted" id="profile-hint" style="display:none;">
          Using your saved details - <a href="/account.html">edit account</a>.
        </p>

        <p class="error" id="checkout-error" style="display:none;"></p>
        <div style="display:flex; gap:0.5rem;">
          <button id="checkout-button">Place order</button>
          <button type="button" class="secondary" id="cancel-order-button">Cancel</button>
        </div>
        <p class="muted" id="checkout-note">
          This is not a checkout - please arrange payment before or at pickup.
        </p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { loadConfig } from "/js/config.js";
    import { apiRequest, formatPrice } from "/js/api.js";
    import { getValidSession, isAdmin } from "/js/cognito.js";
    import { renderNav } from "/js/nav.js";
    import { loginUrlWithReturnTo } from "/js/redirect.js";
    import { computeUnitPriceCents, selectionsKey, formatMacros, formatPhone } from "/js/pricing.js";
    import { MONTH_NAMES, formatDateHeading, groupMealsForMonth } from "/js/monthlyMenu.js";

    renderNav();

    const cart = {}; // selectionsKey -> { meal, selectedAddOnIds, quantity }
    let allAddOns = [];
    let loadedMeals = [];

    const deliveryPhoneInput = document.getElementById("delivery-phone");
    deliveryPhoneInput.addEventListener("input", () => {
      deliveryPhoneInput.value = formatPhone(deliveryPhoneInput.value);
    });

    // Self-contained document (inline <style>, its own Google Fonts link) so
    // the popup window renders correctly without access to this page's own
    // stylesheet - window.open() starts from a blank document.
    function monthlyMenuItemHtml(meal) {
      const macrosText = formatMacros(meal.macros);
      return `
        <div class="item">
          <div class="item-name">${meal.name} - ${formatPrice(meal.priceCents)}</div>
          <div class="item-desc">${meal.description || ""}</div>
          ${macrosText ? `<div class="item-macros">${macrosText}</div>` : ""}
        </div>`;
    }

    function buildMonthlyMenuPopupHtml(meals, monthValue) {
      const [year, month] = monthValue.split("-").map(Number);
      const monthName = MONTH_NAMES[month - 1];
      const { staples, byDate, sortedDates } = groupMealsForMonth(meals, monthValue);

      const staplesHtml = staples.length
        ? `
        <h2>Staple meals</h2>
        <p class="subheading">Available Weekly for the month of ${monthName}</p>
        ${staples.map(monthlyMenuItemHtml).join("")}`
        : "";

      const rotatingHtml = sortedDates.length
        ? `
        <h2>Rotating meals</h2>
        ${sortedDates
          .map(
            (isoDate) => `
          <h3>${formatDateHeading(isoDate)}</h3>
          ${byDate.get(isoDate).map(monthlyMenuItemHtml).join("")}`
          )
          .join("")}`
        : "";

      const body =
        staples.length === 0 && sortedDates.length === 0
          ? `<p class="muted">No menu has been set for ${monthName} ${year} yet - check back soon.</p>`
          : `${staplesHtml}${rotatingHtml}`;

      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent("https://gtxmeals.com")}`;

      return `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GTX Meals - ${monthName} ${year} Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Bebas+Neue&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111111; margin: 0; padding: 0; }
    .flyer { display: flex; align-items: flex-start; gap: 2rem; max-width: 800px; margin: 2rem auto; padding: 0 1.5rem 3rem; }
    .flyer-sidebar { flex-shrink: 0; width: 130px; display: flex; flex-direction: column; align-items: center; }
    .flyer-month-wrap { height: 480px; width: 130px; display: flex; align-items: center; justify-content: center; }
    .flyer-month { font-family: "Permanent Marker", cursive; color: #d20d0d; font-size: 6.21rem; white-space: nowrap; transform: rotate(-90deg); }
    .flyer-qr { width: 110px; height: 110px; margin-top: 1rem; }
    .flyer-scan-caption { font-family: "Anton", sans-serif; font-size: 0.75rem; color: #111111; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.5rem; text-align: center; }
    .flyer-content { flex: 1; min-width: 0; position: relative; }
    .flyer-watermark { position: absolute; top: 50%; left: 0; width: 100%; opacity: 0.07; z-index: -1; pointer-events: none; transform: translateY(-50%) scaleY(1.2); }
    h2 { font-family: "Bebas Neue", Arial, sans-serif; font-weight: 400; color: #8f1a1a; text-transform: uppercase; letter-spacing: 0.01em; font-size: 1.85rem; margin: 2rem 0 0.1rem; }
    h3 { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 400; color: #8f1a1a; font-size: 1.3rem; margin: 1.25rem 0 0.25rem; }
    .subheading { font-family: "Playfair Display", Georgia, serif; font-style: italic; color: #8f1a1a; font-size: 1.3rem; margin: 0 0 0.6rem; }
    .item { margin-bottom: 0.9rem; }
    .item-name { font-weight: bold; margin-bottom: 0.15rem; }
    .item-desc { color: #666666; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .item-macros { font-weight: bold; font-size: 0.85rem; }
    .muted { color: #666666; }
    .flyer-footer { margin-top: 2.5rem; text-align: center; color: #aa0e0c; }
    .flyer-footer .footer-line1 { font-weight: bold; text-transform: uppercase; letter-spacing: 0.02em; }
    .flyer-footer .footer-line2 { font-size: 0.85rem; margin-top: 0.2rem; }
    #print-button { display: block; margin: 1.5rem auto 0; background: #d20d0d; color: #fff; border: none; border-radius: 6px; padding: 0.6rem 1.1rem; font-size: 0.95rem; cursor: pointer; }
    @media print { #print-button { display: none; } }
  </style>
</head>
<body>
  <div class="flyer">
    <div class="flyer-sidebar">
      <div class="flyer-month-wrap"><div class="flyer-month">${monthName.toUpperCase()}</div></div>
      <img class="flyer-qr" src="${qrUrl}" alt="QR code to order" />
      <div class="flyer-scan-caption">Scan to order</div>
    </div>
    <div class="flyer-content">
      <img class="flyer-watermark" src="https://gtxmeals.com/assets/watermark.jpg" alt="" />
      ${body}
      <div class="flyer-footer">
        <div class="footer-line1">Order by Friday 2 PM &bull; Prepared Sunday &bull; Monday pickup</div>
        <div class="footer-line2">Monthly menu is planned in advance and subject to change</div>
      </div>
      <button type="button" id="print-button" onclick="window.print()">View as PDF</button>
    </div>
  </div>
</body>
</html>`;
    }

    document.getElementById("monthly-menu-button").addEventListener("click", async () => {
      const { meals } = await apiRequest((await loadConfig()).apiUrl, "/meals");
      const now = new Date();
      const monthValue = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      const html = buildMonthlyMenuPopupHtml(meals, monthValue);

      // A real navigation to a blob: URL rather than window.open("") +
      // document.write() - some browsers don't reliably run external
      // resource fetches (like the Google Fonts <link>) for a document
      // synthesized via document.write(), since it was never actually
      // "loaded" the normal way. A blob URL is a genuine page load.
      const blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      const popup = window.open(blobUrl, "_blank");
      if (!popup) {
        alert("Please allow pop-ups for this site to view the monthly menu.");
        URL.revokeObjectURL(blobUrl);
        return;
      }
      setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
    });

    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove("visible"), 2500);
    }

    function renderCart() {
      const section = document.getElementById("cart-section");
      const lines = document.getElementById("cart-lines");
      const entries = Object.entries(cart);

      if (entries.length === 0) {
        section.style.display = "none";
        return;
      }
      section.style.display = "block";

      let total = 0;
      lines.innerHTML = entries
        .map(([key, { meal, selectedAddOnIds, note, quantity }]) => {
          const unitPrice = computeUnitPriceCents(meal, allAddOns, selectedAddOnIds);
          total += unitPrice * quantity;
          const selectedAddOns = selectedAddOnIds.map((id) => allAddOns.find((a) => a.addOnId === id)).filter(Boolean);
          const addOnText = selectedAddOns
            .map((a) => {
              const macrosText = formatMacros(a.macros);
              return `<div class="muted" style="font-size:0.85rem;">${a.description}${macrosText ? ` - ${macrosText}` : ""}</div>`;
            })
            .join("");
          const noteText = note ? `<div class="muted" style="font-size:0.85rem;">Note: ${note}</div>` : "";
          return `<div class="cart-line-wrap" data-cart-key="${key}">
            <div class="cart-line">
              <span>${meal.name}</span>
              <div class="qty-control">
                <button type="button" class="secondary qty-minus">-</button>
                <input type="number" class="qty-input" name="qty-${key}" aria-label="Quantity for ${meal.name}" min="1" value="${quantity}" />
                <button type="button" class="secondary qty-plus">+</button>
              </div>
              <span>${formatPrice(unitPrice * quantity)}</span>
            </div>
            ${addOnText}
            ${noteText}
          </div>`;
        })
        .join("");
      document.getElementById("cart-total").textContent = formatPrice(total);

      lines.querySelectorAll(".qty-minus").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.closest(".cart-line-wrap").dataset.cartKey;
          setQuantity(key, cart[key].quantity - 1);
        });
      });
      lines.querySelectorAll(".qty-plus").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.closest(".cart-line-wrap").dataset.cartKey;
          setQuantity(key, cart[key].quantity + 1);
        });
      });
      lines.querySelectorAll(".qty-input").forEach((input) => {
        input.addEventListener("change", () => {
          const key = input.closest(".cart-line-wrap").dataset.cartKey;
          setQuantity(key, parseInt(input.value, 10) || 0);
        });
      });
    }

    function setQuantity(key, quantity) {
      if (quantity <= 0) {
        delete cart[key];
      } else {
        cart[key].quantity = quantity;
      }
      renderCart();
    }

    function addToCart(meal, selectedAddOnIds, note) {
      const key = selectionsKey(meal.mealId, selectedAddOnIds, note);
      if (!cart[key]) {
        cart[key] = { meal, selectedAddOnIds, note, quantity: 0 };
      }
      cart[key].quantity += 1;
      renderCart();
    }

    function setCartItem(meal, selectedAddOnIds, note, quantity) {
      const key = selectionsKey(meal.mealId, selectedAddOnIds, note);
      cart[key] = { meal, selectedAddOnIds, note, quantity };
      renderCart();
    }

    function applyEditCart() {
      const raw = sessionStorage.getItem("editOrderCart");
      if (!raw) return;
      sessionStorage.removeItem("editOrderCart");

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        return;
      }

      (data.items || []).forEach((item) => {
        const meal = loadedMeals.find((m) => m.mealId === item.mealId);
        if (!meal) return; // no longer on the menu - nothing to re-add
        setCartItem(meal, item.selectedAddOnIds || [], item.note || "", item.quantity || 1);
      });

      const delivery = data.delivery || {};
      if (delivery.name) document.getElementById("delivery-name").value = delivery.name;
      if (delivery.email) document.getElementById("delivery-email").value = delivery.email;
      if (delivery.phone) document.getElementById("delivery-phone").value = formatPhone(delivery.phone);
      if (delivery.address) document.getElementById("delivery-address").value = delivery.address;

      document.getElementById("edit-notice").style.display = "block";
    }

    function cancelOrder() {
      Object.keys(cart).forEach((key) => delete cart[key]);
      document.getElementById("checkout-error").style.display = "none";
      renderCart();
    }

    function renderMacros(macros) {
      const text = formatMacros(macros);
      return text ? `<p class="macros muted">${text}</p>` : "";
    }

    function renderAddOnChoices(meal, disabled) {
      const visibleAddOns = allAddOns.filter((a) => a.available);
      if (visibleAddOns.length === 0) return "";
      return `<div class="option-groups">
        ${visibleAddOns
          .map((a) => {
            const macrosText = formatMacros(a.macros);
            return `
          <label class="option-choice">
            <input type="checkbox" class="addon-choice" data-addon-id="${a.addOnId}" ${disabled ? "disabled" : ""} />
            ${a.description} (+${formatPrice(a.priceCents)})
            ${macrosText ? `<div class="muted addon-macros">${macrosText}</div>` : ""}
          </label>`;
          })
          .join("")}
      </div>`;
    }

    function formatReadyDate(isoDate) {
      const [y, m, d] = isoDate.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }

    // Orders must be placed at least this many days before the ready date -
    // mirrors the server's ORDER_CUTOFF_DAYS so the UI can head off an order
    // that the API would reject anyway, with a clearer explanation.
    const ORDER_CUTOFF_DAYS = 2;

    function isOrderingClosed(nextReadyDate) {
      if (!nextReadyDate) return false;
      const [y, m, d] = nextReadyDate.split("-").map(Number);
      const cutoff = new Date(y, m - 1, d);
      cutoff.setDate(cutoff.getDate() - ORDER_CUTOFF_DAYS);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return today > cutoff;
    }

    async function loadMenu(config, loggedIn, admin, nextReadyDate) {
      const container = document.getElementById("meals");
      const loginPrompt = document.getElementById("login-prompt");
      const orderingClosed = !admin && isOrderingClosed(nextReadyDate);
      const interactive = loggedIn && !admin && !orderingClosed;

      if (admin) {
        loginPrompt.style.display = "block";
        loginPrompt.textContent =
          "Viewing as admin - read-only. This is just to check the menu looks right; orders are placed by customer accounts.";
      } else if (orderingClosed) {
        loginPrompt.style.display = "block";
        loginPrompt.textContent =
          `Ordering is closed for the ${formatReadyDate(nextReadyDate)} ready date - check back soon for the next one.`;
      } else {
        loginPrompt.style.display = loggedIn ? "none" : "block";
        loginPrompt.innerHTML = loggedIn
          ? ""
          : `<a href="${loginUrlWithReturnTo()}">Log in or sign up</a> to pick meals and place an order.`;
      }

      try {
        const [{ meals }, { addOns }] = await Promise.all([
          apiRequest(config.apiUrl, "/meals"),
          apiRequest(config.apiUrl, "/addons"),
        ]);
        allAddOns = addOns;

        // On the menu if it's always available, or its week-of date matches
        // the current ready date - a meal with neither (e.g. a future week's
        // meal, or one with no date set yet) stays hidden until it does.
        const available = meals.filter(
          (m) => m.available && (m.staple || (nextReadyDate && m.weekOf === nextReadyDate))
        );
        loadedMeals = available;
        if (available.length === 0) {
          container.innerHTML = `<p class="muted">No meals on the menu right now - check back soon.</p>`;
          return;
        }
        container.innerHTML = available
          .map(
            (meal) => `
          <div class="card meal-card" data-meal-id="${meal.mealId}">
            <h3>${meal.name}</h3>
            <p class="description">${meal.description || ""}</p>
            ${renderMacros(meal.macros)}
            <p class="price">${formatPrice(meal.priceCents)}</p>
            ${renderAddOnChoices(meal, !interactive)}
            <label for="note-${meal.mealId}" class="muted" style="font-size:0.85rem; font-weight:normal;">Special requests</label>
            <input
              type="text" class="note-input" id="note-${meal.mealId}"
              placeholder="e.g. hold the cheese" maxlength="200"
              ${interactive ? "" : "disabled"}
            />
            <button class="add-to-order" data-meal-id="${meal.mealId}" ${interactive ? "" : "disabled"}>Add to order</button>
          </div>`
          )
          .join("");

        if (!interactive) return; // anonymous visitor or admin - nothing left to wire up

        container.querySelectorAll("button.add-to-order").forEach((btn) => {
          btn.addEventListener("click", () => {
            const cardEl = btn.closest(".meal-card");
            const meal = available.find((m) => m.mealId === btn.dataset.mealId);
            const selectedAddOnIds = [...cardEl.querySelectorAll(".addon-choice:checked")].map((el) => el.dataset.addonId);
            const noteInput = cardEl.querySelector(".note-input");
            const note = noteInput.value.trim();
            addToCart(meal, selectedAddOnIds, note);
            cardEl.querySelectorAll(".addon-choice:checked").forEach((el) => (el.checked = false));
            noteInput.value = "";
            showToast(`${meal.name} added to your order`);
          });
        });
      } catch (err) {
        container.innerHTML = `<p class="error">Couldn't load the menu: ${err.message}</p>`;
      }
    }

    async function prefillFromProfile(config, session) {
      if (!session) return;
      try {
        const profile = await apiRequest(config.apiUrl, "/profile", { token: session.idToken });
        document.getElementById("delivery-name").value = profile.name || "";
        document.getElementById("delivery-email").value = profile.email || "";
        document.getElementById("delivery-phone").value = formatPhone(profile.phone || "");
        document.getElementById("delivery-address").value = profile.address || "";
        if (profile.name || profile.address) {
          document.getElementById("profile-hint").style.display = "block";
        }
      } catch (err) {
        // Non-fatal - checkout still works, just without prefilled fields.
      }
    }

    async function placeOrder(config) {
      const errorEl = document.getElementById("checkout-error");
      errorEl.style.display = "none";

      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      if (!session) {
        window.location.href = loginUrlWithReturnTo();
        return;
      }

      const items = Object.values(cart).map(({ meal, selectedAddOnIds, note, quantity }) => ({
        mealId: meal.mealId,
        quantity,
        selectedAddOnIds,
        note,
      }));

      const deliveryName = document.getElementById("delivery-name").value;
      const deliveryEmail = document.getElementById("delivery-email").value;
      const deliveryPhone = document.getElementById("delivery-phone").value;
      const deliveryAddress = document.getElementById("delivery-address").value;

      try {
        await apiRequest(config.apiUrl, "/orders", {
          method: "POST",
          token: session.idToken,
          body: { items, deliveryName, deliveryEmail, deliveryPhone, deliveryAddress },
        });
        // Keep the saved profile in sync so next time's checkout is prefilled
        // even if they changed something this time.
        apiRequest(config.apiUrl, "/profile", {
          method: "PUT",
          token: session.idToken,
          body: { name: deliveryName, email: deliveryEmail, phone: deliveryPhone, address: deliveryAddress },
        }).catch(() => {});
        window.location.href = "/orders.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    }

    loadConfig().then(async (config) => {
      const session = await getValidSession({ region: config.region, clientId: config.userPoolClientId });
      const admin = isAdmin(session);
      const { nextReadyDate } = await apiRequest(config.apiUrl, "/settings").catch(() => ({ nextReadyDate: "" }));

      const readyInfo = document.getElementById("ready-date-info");
      if (nextReadyDate) {
        readyInfo.style.display = "block";
        readyInfo.textContent = `Next ready date: ${formatReadyDate(nextReadyDate)}`;
      }

      await Promise.all([
        loadMenu(config, !!session, admin, nextReadyDate),
        admin ? Promise.resolve() : prefillFromProfile(config, session),
      ]);
      if (!admin) {
        applyEditCart();
        document.getElementById("checkout-button").addEventListener("click", () => placeOrder(config));
        document.getElementById("cancel-order-button").addEventListener("click", cancelOrder);
      }
    });
  </script>
</body>
</html>
